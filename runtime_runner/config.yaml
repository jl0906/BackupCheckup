name: BackupCheckup Runtime Runner
version: "3.0.7"
slug: backup_checkup_runtime_runner
description: Starts a verified backup in an ephemeral, network-isolated Home Assistant instance.
url: https://github.com/jl0906/BackupCheckup
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
init: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Internal authenticated runner API
discovery:
  - backup_checkup
hassio_api: true
homeassistant_api: false
host_network: false
privileged:
  - NET_ADMIN
  - SYS_ADMIN
tmpfs: false
backup: cold
options:
  maximum_archive_gb: 50
  maximum_expanded_gb: 250
  runtime_timeout_minutes: 20
schema:
  maximum_archive_gb: int(1,2048)
  maximum_expanded_gb: int(1,8192)
  runtime_timeout_minutes: int(2,60)
