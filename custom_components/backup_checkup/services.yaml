verify_latest_backup:
  name: Verify latest backup
  description: >-
    Downloads and fully verifies the newest Home Assistant backup while enforcing
    BackupCheckup's configured resource and privacy safeguards. Administrator access
    is required.

refresh:
  name: Refresh BackupCheckup
  description: >-
    Refreshes BackupCheckup's inventory and health evaluation immediately.
    Administrator access is required.

test_notification:
  name: Send test notification
  description: >-
    Sends one localized test notification to the configured notification targets.
    Administrator access is required.

clear_activity_log:
  name: Clear live log
  description: >-
    Clears all buffered and, when enabled, persisted privacy-safe activity records.
    Administrator access is required.

set_recovery_preparedness:
  name: Update recovery preparedness
  description: >-
    Updates one fixed recovery-checklist or external-dependency state. Only predefined
    enum values are stored locally; no passwords, notes, paths, or other secrets are
    accepted. Administrator access is required.
  fields:
    section:
      name: Section
      description: Select whether a checklist or dependency item is updated.
      required: true
      selector:
        select:
          options:
            - checklist
            - dependencies
    item:
      name: Item
      description: Fixed checklist or dependency key.
      required: true
      selector:
        select:
          options:
            - backup_password_available
            - storage_access_documented
            - restore_method_known
            - replacement_hardware_available
            - network_access_documented
            - recovery_contacts_documented
            - external_database
            - mqtt
            - zigbee
            - zwave
            - thread
            - esphome
            - network_storage
            - reverse_proxy
            - certificates
            - cloud_services
    status:
      name: Status
      description: Fixed state valid for the selected section.
      required: true
      selector:
        select:
          options:
            - unknown
            - confirmed
            - missing
            - not_required
            - protected
            - unprotected
            - not_applicable
