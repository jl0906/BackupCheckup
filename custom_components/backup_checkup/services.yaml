verify_latest_backup:
  name: Check backup protection (legacy alias)
  description: >-
    Compatibility alias for Check backup protection. It runs the same unified,
    non-destructive protected read pipeline. Administrator access is required.

simulate_restore:
  name: Check backup protection
  description: >-
    Runs the administrator-only, unified non-destructive protection check for the
    newest monitored backup. The protected verification pipeline downloads,
    decrypts, and fully reads the backup without restoring data.

refresh:
  name: Refresh BackupCheckup
  description: >-
    Refreshes BackupCheckup's inventory and health evaluation immediately.
    Administrator access is required.

test_notification:
  name: Send test notification
  description: >-
    Sends one localized test notification to the configured notification targets.
    Administrator access is required.

clear_activity_log:
  name: Clear live log
  description: >-
    Clears all buffered and, when enabled, persisted privacy-safe activity records.
    Administrator access is required.

set_recovery_preparedness:
  name: Update recovery preparedness
  description: >-
    Updates one fixed recovery-checklist or external-dependency state. Only predefined
    enum values are stored locally; no passwords, notes, paths, or other secrets are
    accepted. Administrator access is required.
  fields:
    section:
      name: Section
      description: Select whether a checklist or dependency item is updated.
      required: true
      selector:
        select:
          options:
            - checklist
            - dependencies
    item:
      name: Item
      description: Fixed checklist or dependency key.
      required: true
      selector:
        select:
          options:
            - backup_password_available
            - storage_access_documented
            - restore_method_known
            - replacement_hardware_available
            - network_access_documented
            - recovery_contacts_documented
            - external_database
            - mqtt
            - zigbee
            - zwave
            - thread
            - esphome
            - network_storage
            - reverse_proxy
            - certificates
            - cloud_services
    status:
      name: Status
      description: Fixed state valid for the selected section.
      required: true
      selector:
        select:
          options:
            - unknown
            - confirmed
            - missing
            - not_required
            - protected
            - unprotected
            - not_applicable

record_restore_test:
  name: Document optional test restore
  description: >-
    Optionally records the outcome of a restore test performed outside the productive Home
    Assistant instance. The action stores only the current backup reference, fixed
    enum values, and the current timestamp. No notes or secrets are accepted.
    Administrator access is required.
  fields:
    result:
      name: Result
      description: Whether the tested restore completed successfully.
      required: true
      selector:
        select:
          options:
            - successful
            - failed
    scope:
      name: Scope
      description: Whether a full or partial restore was tested.
      required: true
      selector:
        select:
          options:
            - full
            - partial
